<!DOCTYPE html>
<html lang="en-US">

    <head>

        <meta charset="UTF-8">
        <title>My Calculator</title>
        <meta name="viewport" content="width=device-width" initial-scale="1.0">
        <link rel="stylesheet" href="calcu.css">

    </head>

    <body>
    
        <main>
            <div class="calculator">
                <p id="display">0</p>
                <div id="keys">

                    <!--key-overall design; digit-each digit; data-for js; button-variable for the numbers-->

                    <button class="key strip">X</button>
                    <button class="key clears">AC</button>
                    <button class="key percent">%</button> <!--data-perbutton="%"-->
                    <button class="key op" data-opbutton="/">&divide;</button> <!--to separate operation-->

                    <button class="key digit" data-button="7">7</button>
                    <button class="key digit" data-button="8">8</button>
                    <button class="key digit" data-button="9">9</button>
                    <button class="key op" data-opbutton="*">&times;</button> 

                    <button class="key digit" data-button="4">4</button>
                    <button class="key digit" data-button="5">5</button>
                    <button class="key digit" data-button="6">6</button>
                    <button class="key op" data-opbutton="-">-</button>

                    <button class="key digit" data-button="1">1</button>
                    <button class="key digit" data-button="2">2</button>
                    <button class="key digit" data-button="3">3</button>
                    <button class="key op" data-opbutton="+">+</button>

                    <button class="key digit" data-button=".">.</button>               
                    <button class="key digit" data-button="0">0</button> 
                    <button class="key seehistory">&#128344;</button>
                    <button class="key equals">=</button>
                </div>
            </div>
        </main>

        <script src="calcu.js"></script>

    </body>

</html>
